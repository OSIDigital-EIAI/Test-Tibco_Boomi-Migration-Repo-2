="522" font-size="11" fill="#13203A">swallowed</text><path d="M 292 180 V 206 H 420 V 232" fill="none" stroke="#B4442A" stroke-width="1.5" marker-end="url(#osimt-flow-arrow)"/><text x="356" y="201" text-anchor="middle" font-size="11" fill="#13203A">connection fault</text><rect x="182" y="16" width="220" height="56" rx="28" fill="#F6F8FB" stroke="#0B7A73" stroke-width="1.5"/><text text-anchor="middle" font-size="12.5" fill="#13203A"><title>Start — No starter activity; run from the Designer tester.</title><tspan x="292" y="48">Start</tspan></text><rect x="182" y="124" width="220" height="56" rx="10" fill="#F6F8FB" stroke="#D7DEE8" stroke-width="1.5"/><text text-anchor="middle" font-size="12.5" fill="#13203A"><title>JDBC Get Connection — Pooled connection to localhost:1521:xe as SYSTEM; commit false; outputs JavaConnectionAccessor.</title><tspan x="292" y="156">JDBC Get Connection</tspan></text><rect x="54" y="232" width="220" height="56" rx="10" fill="#F6F8FB" stroke="#D7DEE8" stroke-width="1.5"/><text text-anchor="middle" font-size="12.5" fill="#13203A"><title>Java: build nested Oracle objects — STRUCT O_COLLECTIONSIMPLE → ARRAY T_COLLECTIONLISTSIMPLE → STRUCT O_COLLECTIONCOMPLEX with placeholder values, using ojdbc6 descriptors.</title><tspan x="164" y="256">Java: build nested Oracle</tspan><tspan x="164" y="272">objects</tspan></text><rect x="310" y="232" width="220" height="56" rx="10" fill="#F6F8FB" stroke="#B4442A" stroke-width="2"/><text text-anchor="middle" font-size="12.5" fill="#13203A"><title>Unhandled fault — Only JDBC Get Connection can fault the process; no catch.</title><tspan x="420" y="264">Unhandled fault</tspan></text><rect x="182" y="340" width="220" height="56" rx="10" fill="#F6F8FB" stroke="#D7DEE8" stroke-width="1.5"/><text text-anchor="middle" font-size="12.5" fill="#13203A"><title>Java: call ESB_STUBS.TEST.GETCOMPLEX — prepareCall(&#39;{ call ESB_STUBS.TEST.GETCOMPLEX(?,?) }&#39;); setObject(1, struct); registerOutParameter(2, VARCHAR); execute(); output = getString(2).</title><tspan x="292" y="364">Java: call</tspan><tspan x="292" y="380">ESB_STUBS.TEST.GETCOMPLEX</tspan></text><rect x="182" y="448" width="220" height="56" rx="10" fill="#F6F8FB" stroke="#B4442A" stroke-width="2"/><text text-anchor="middle" font-size="12.5" fill="#13203A"><title>Java: catch and print exception — Any exception from n3 or n4 is caught and printed; &#39;output&#39; left empty; flow continues to End as success.</title><tspan x="292" y="472">Java: catch and print</tspan><tspan x="292" y="488">exception</tspan></text><rect x="182" y="556" width="220" height="56" rx="28" fill="#F6F8FB" stroke="#0B7A73" stroke-width="1.5"/><text text-anchor="middle" font-size="12.5" fill="#13203A"><title>End — &#39;output&#39; unused.</title><tspan x="292" y="588">End</tspan></text></svg>