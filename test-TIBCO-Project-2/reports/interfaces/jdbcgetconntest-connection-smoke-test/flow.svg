Start — No starter activity; run from the Designer tester.</title><tspan x="274" y="48">Start</tspan></text><rect x="164" y="124" width="220" height="56" rx="10" fill="#F6F8FB" stroke="#D7DEE8" stroke-width="1.5"/><text text-anchor="middle" font-size="12.5" fill="#13203A"><title>JDBC Get Connection — Acquires a pooled connection to localhost:1521:ORCL as scott; commit false; outputs JavaConnectionAccessor.</title><tspan x="274" y="156">JDBC Get Connection</tspan></text><rect x="164" y="232" width="220" height="56" rx="10" fill="#F6F8FB" stroke="#D7DEE8" stroke-width="1.5"/><text text-anchor="middle" font-size="12.5" fill="#13203A"><title>Java Code print driver metadata — GetConnTestProcessJavaCode.invoke(): getDBConnection(), print URL, driver name, driver version, &#39;---&gt; SUCCESS!&#39; to stdout. No outputs.</title><tspan x="274" y="256">Java Code print driver</tspan><tspan x="274" y="272">metadata</tspan></text><rect x="36" y="340" width="220" height="56" rx="10" fill="#F6F8FB" stroke="#D7DEE8" stroke-width="1.5"/><text text-anchor="middle" font-size="12.5" fill="#13203A"><title>Log Success.. — WriteToLogActivity, role User, constant message.</title><tspan x="146" y="372">Log Success..</tspan></text><rect x="292" y="340" width="220" height="56" rx="10" fill="#F6F8FB" stroke="#B4442A" stroke-width="2"/><text text-anchor="middle" font-size="12.5" fill="#13203A"><title>Unhandled fault — Connection failure or Java exception aborts the instance; no catch.</title><tspan x="402" y="372">Unhandled fault</tspan></text><rect x="164" y="448" width="220" height="56" rx="28" fill="#F6F8FB" stroke="#0B7A73" stroke-width="1.5"/><text text-anchor="middle" font-size="12.5" fill="#13203A"><title>End</title><tspan x="274" y="480">End</tspan></text></svg>